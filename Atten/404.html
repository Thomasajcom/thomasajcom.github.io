<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lost a tile — Atten</title>
<meta name="description" content="That page doesn't exist. Head back to Atten.">
<meta name="theme-color" content="#F4F1E8">
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" sizes="32x32" href="/Atten/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/Atten/assets/icon-192.png">
<link rel="apple-touch-icon" href="/Atten/assets/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root {
  --bg: #F4F1E8;
  --surface: #FFFFFF;
  --text-primary: #1D1D1F;
  --text-secondary: #6F6E74;
  --text-tertiary: #A6A4AC;
  --gold-top: #F4D47A;
  --gold-mid: #C89838;
  --gold-bot: #8A6420;
  --gold-text: #3A2810;
  --tile-fill-dark: #2F2F38;
  --tile-text-dark: #EFE7CD;
}

html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 60px 32px;
  line-height: 1.5;
}

body::after {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 200px;
  opacity: 0.025;
  pointer-events: none;
  z-index: 9999;
}

.tile-row {
  display: flex;
  gap: 10px;
  margin-bottom: 36px;
}

.tile {
  width: 84px;
  height: 84px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 38px;
  font-weight: 900;
  background: var(--tile-fill-dark);
  color: var(--tile-text-dark);
  box-shadow: 0 4px 14px rgba(0,0,0,0.10);
}

.tile.gold {
  background: linear-gradient(135deg, var(--gold-top), var(--gold-mid), var(--gold-bot));
  color: var(--gold-text);
  box-shadow: 0 0 0 0 rgba(244, 212, 122, 0.5), 0 6px 24px rgba(200, 152, 56, 0.32);
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(244, 212, 122, 0.0), 0 6px 24px rgba(200, 152, 56, 0.32); }
  50%      { box-shadow: 0 0 0 10px rgba(244, 212, 122, 0.18), 0 6px 24px rgba(200, 152, 56, 0.32); }
}

h1 {
  font-size: clamp(2.5rem, 8vw, 4.5rem);
  font-weight: 900;
  letter-spacing: -0.04em;
  line-height: 1;
  margin-bottom: 14px;
}

h1 .gold {
  background: linear-gradient(135deg, var(--gold-top), var(--gold-mid), var(--gold-bot));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.subtitle {
  font-family: 'Newsreader', serif;
  font-style: italic;
  font-size: clamp(1.0625rem, 2.4vw, 1.375rem);
  color: var(--text-secondary);
  max-width: 460px;
  margin: 0 auto 40px;
}

.btn-row {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: center;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Outfit', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  padding: 13px 28px;
  border-radius: 980px;
  text-decoration: none;
  transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s, color 0.2s;
}

.btn-primary {
  color: var(--gold-text);
  background: linear-gradient(135deg, var(--gold-top), var(--gold-mid), var(--gold-bot));
  box-shadow: 0 4px 16px rgba(200, 152, 56, 0.25);
}
.btn-primary:hover {
  transform: scale(1.03);
  box-shadow: 0 8px 30px rgba(200, 152, 56, 0.35);
}

.btn-secondary {
  color: var(--text-secondary);
  border: 1.5px solid rgba(0,0,0,0.12);
}
.btn-secondary:hover {
  border-color: rgba(0,0,0,0.32);
  color: var(--text-primary);
}

.label {
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-tertiary);
  margin-bottom: 24px;
}

footer {
  position: absolute;
  bottom: 24px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.8125rem;
  color: var(--text-tertiary);
}
footer a {
  color: var(--text-secondary);
  text-decoration: none;
}
footer a:hover { color: var(--text-primary); }
</style>
</head>
<body>

<div class="label">Error 4 + 0 + 4</div>

<div class="tile-row" aria-hidden="true">
  <div class="tile">4</div>
  <div class="tile">0</div>
  <div class="tile gold">18</div>
</div>

<h1>That tile <span class="gold">vanished.</span></h1>
<p class="subtitle">The page you're looking for cleared into the cascade. Head back and start a fresh run.</p>

<div class="btn-row">
  <a href="/Atten/" class="btn btn-primary">Back to Atten</a>
  <a href="/Atten/support.html" class="btn btn-secondary">Support</a>
</div>

<footer>
  <p>&copy; 2026 Atten &middot; <a href="/Atten/privacy.html">Privacy</a> &middot; <a href="/Atten/support.html">Support</a></p>
</footer>

</body>
</html>
