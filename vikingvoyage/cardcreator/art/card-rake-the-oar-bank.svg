<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="A longship's oar bank shattered, three looms snapped and turning in the air, carved in stone">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8d2c1"/>
    <stop offset=".52" stop-color="#c7c1b0"/>
    <stop offset="1" stop-color="#aea795"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="4" seed="5"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="carve" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="13" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="2.6" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow in="d" dx="2.2" dy="2.2" stdDeviation="0" flood-color="#f4eee0" flood-opacity=".9"/>
  </filter>
</defs>

<rect width="640" height="360" fill="url(#stone)"/>

<g filter="url(#carve)">
  <!-- ── the sea ── -->
  <g stroke="#34302a" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".7">
    <path d="M-14,306 q22,-9 44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0"/>
    <path d="M-36,330 q22,-9 44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0"/>
    <path d="M-14,352 q22,-9 44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0"/>
  </g>

  <!-- ── mast and yard, sail brailed up for the fight ── -->
  <g stroke="#34302a" fill="none" stroke-linecap="round">
    <path d="M330,250 L330,66" stroke-width="8"/>
    <path d="M250,88 L410,88" stroke-width="7"/>
    <path d="M254,94 Q330,144 406,94" stroke-width="22"/>
  </g>
  <g stroke="#cdc7b6" stroke-width="2.4" stroke-linecap="round" opacity=".5">
    <path d="M284,99 L284,121"/><path d="M307,105 L307,128"/><path d="M330,108 L330,131"/>
    <path d="M353,105 L353,128"/><path d="M376,99 L376,121"/>
  </g>

  <!-- ── hull ── -->
  <path d="M140,212 Q330,246 520,212 Q470,282 330,284 Q190,282 140,212 Z" fill="#34302a"/>
  <g stroke="#cdc7b6" stroke-width="2.4" fill="none" opacity=".42">
    <path d="M154,228 Q330,258 506,228"/>
    <path d="M172,250 Q330,276 488,250"/>
  </g>

  <!-- ── stem posts, each closing in a volute ── -->
  <g stroke="#34302a" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M518,214 C548,174 566,130 568,98"/>
    <path d="M568,98 C572,82 564,70 550,72 C538,74 532,86 540,94 C546,100 555,97 556,90"/>
    <path d="M142,212 C116,180 104,144 104,118"/>
    <path d="M104,118 C103,106 110,98 119,100 C127,102 130,111 124,116 C120,119 114,117 114,112"/>
  </g>

  <!-- ══ THE OAR BANK — drawn over the hull, reaching clear of it ══ -->
  <!-- five still pulling -->
  <g stroke="#34302a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M178,248 L132,310"/>
    <path d="M203,261 L157,323"/>
    <path d="M370,282 L324,344"/>
    <path d="M428,272 L382,334"/>
    <path d="M482,248 L436,310"/>
  </g>
  <!-- three snapped at the loom -->
  <g stroke="#34302a" stroke-width="7" stroke-linecap="butt" fill="none">
    <path d="M243,274 L222,302"/>
    <path d="M290,282 L269,310"/>
    <path d="M330,284 L309,312"/>
  </g>
  <!-- and their outer halves, turning in the air above the sheer -->
  <g stroke="#34302a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M258,212 L228,182"/>
    <path d="M304,204 L278,172"/>
    <path d="M348,208 L330,174"/>
  </g>

  <!-- ── our own gunwale, hard alongside ── -->
  <path d="M-20,362 L-20,318 C52,310 132,326 206,354 L206,362 Z" fill="#34302a"/>
  <path d="M-20,336 C50,328 126,344 198,370" stroke="#cdc7b6" stroke-width="2.6" fill="none" opacity=".38"/>

  <!-- ── splinters: the only pigment on this stone ── -->
  <g fill="#a8492f">
    <path d="M222,298 l10,14 l-15,-3 z"/>
    <path d="M269,306 l10,14 l-15,-3 z"/>
    <path d="M309,308 l10,14 l-15,-3 z"/>
    <path d="M246,262 l7,-16 l5,17 z"/>
    <path d="M294,268 l6,-17 l6,16 z"/>
    <path d="M334,270 l5,-17 l7,16 z"/>
    <path d="M240,196 l-15,-6 l14,-5 z"/>
    <path d="M288,186 l-14,-7 l14,-5 z"/>
    <path d="M338,190 l-14,-8 l13,-6 z"/>
  </g>
</g>

<rect width="640" height="360" filter="url(#grain)" opacity=".22" style="mix-blend-mode:multiply"/>
</svg>
