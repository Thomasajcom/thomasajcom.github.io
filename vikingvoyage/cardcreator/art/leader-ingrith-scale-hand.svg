<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 720" width="540" height="720" role="img" aria-label="Ingrith Scale-Hand, a weigh-master turned raider, carved as a memorial stone figure">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dad4c3"/>
    <stop offset=".5" stop-color="#c9c3b2"/>
    <stop offset="1" stop-color="#aca595"/>
  </linearGradient>
  <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#bcbfac"/>
    <stop offset="1" stop-color="#a6a995"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" seed="23"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <!-- the incision: a slow wobble so nothing is machine-true, then a hard pale
       lip on the lower-right — the one edge of a cut groove that catches light -->
  <filter id="carve" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="41" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow in="d" dx="2.4" dy="2.4" stdDeviation="0" flood-color="#f4eee0" flood-opacity=".92"/>
  </filter>
</defs>

<rect width="540" height="720" fill="url(#stone)"/>
<rect x="44" y="70" width="452" height="606" fill="url(#field)"/>

<g filter="url(#carve)">
  <!-- ── cable band across the head of the stone ── -->
  <g stroke="#34302a" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M44,36 q28,-14 56,0 t56,0 t56,0 t56,0 t56,0 t56,0 t56,0 t56,0"/>
    <path d="M44,36 q28,14 56,0 t56,0 t56,0 t56,0 t56,0 t56,0 t56,0 t56,0"/>
  </g>
  <g stroke="#34302a" fill="none">
    <rect x="44" y="70" width="452" height="606" stroke-width="5"/>
    <rect x="55" y="81" width="430" height="584" stroke-width="2.2" opacity=".6"/>
  </g>

  <!-- ── weather ── -->
  <g stroke="#34302a" stroke-width="4.5" fill="none" stroke-linecap="round" opacity=".26">
    <path d="M80,132 q40,-13 80,0 t80,0 t80,0"/>
    <path d="M70,164 q40,-13 80,0 t80,0 t80,0"/>
  </g>

  <!-- ── her ship, in the upper register where a stone puts the voyage ── -->
  <g opacity=".92">
    <path d="M348,240 Q412,262 476,240 Q412,284 348,240 Z" fill="#34302a"/>
    <g stroke="#34302a" fill="none" stroke-linecap="round">
      <path d="M412,254 L412,178" stroke-width="4.5"/>
      <path d="M384,182 L440,182" stroke-width="3.6"/>
      <path d="M386,184 L438,184 L446,228 L378,228 Z" stroke-width="3.6"/>
      <path d="M474,242 C490,234 497,222 492,212 C487,203 475,203 470,211 C466,217 471,224 478,223" stroke-width="5"/>
    </g>
    <g stroke="#a8492f" stroke-width="2.4">
      <path d="M404,184 L392,228"/><path d="M420,184 L432,228"/><path d="M382,206 L442,206"/>
    </g>
  </g>

  <!-- ══ neck first, so the cloak lies over it ══ -->
  <path d="M240,342 L300,342 L308,424 L232,424 Z" fill="#c9c3b2" stroke="#34302a" stroke-width="3"/>

  <!-- ══ THE CLOAK ══ -->
  <path d="M112,676 L150,428 C200,386 340,386 390,428 L428,676 Z" fill="#a8492f"/>
  <g stroke="#34302a" stroke-width="3" fill="none" opacity=".38">
    <path d="M186,436 L166,676"/>
    <path d="M240,420 L232,676"/>
    <path d="M300,420 L308,676"/>
    <path d="M354,436 L374,676"/>
  </g>

  <!-- ══ HEAD ══ -->
  <ellipse cx="270" cy="272" rx="78" ry="94" fill="#c9c3b2" stroke="#34302a" stroke-width="4.5"/>
  <path d="M192,264 C186,190 230,158 270,158 C310,158 354,190 348,264 C338,222 314,200 270,200 C226,200 202,222 192,264 Z" fill="#34302a"/>

  <!-- braids -->
  <g stroke="#34302a" stroke-width="21" stroke-linecap="round" fill="none">
    <path d="M198,272 C182,336 180,404 190,452"/>
    <path d="M342,272 C358,336 360,404 350,452"/>
  </g>
  <g stroke="#c9c3b2" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M188,296 L206,302"/><path d="M184,326 L202,332"/><path d="M182,356 L200,362"/>
    <path d="M182,386 L200,392"/><path d="M184,416 L202,422"/>
    <path d="M334,302 L352,296"/><path d="M338,332 L356,326"/><path d="M340,362 L358,356"/>
    <path d="M340,392 L358,386"/><path d="M338,422 L356,416"/>
  </g>
  <!-- trade weights wound into the braids -->
  <g fill="#a8492f">
    <circle cx="186" cy="342" r="7"/><circle cx="184" cy="400" r="7"/>
    <circle cx="354" cy="342" r="7"/><circle cx="356" cy="400" r="7"/>
  </g>

  <!-- ── the face: cut, not modelled ── -->
  <g stroke="#34302a" fill="none" stroke-linecap="round">
    <path d="M224,250 Q270,238 316,250" stroke-width="5"/>
    <path d="M270,262 L261,310 L286,314" stroke-width="4"/>
    <path d="M244,340 Q270,332 296,340" stroke-width="4.5"/>
  </g>
  <g stroke="#34302a" stroke-width="3.6" fill="none">
    <path d="M220,276 Q240,262 260,276 Q240,290 220,276 Z"/>
    <path d="M280,276 Q300,262 320,276 Q300,290 280,276 Z"/>
  </g>
  <circle cx="240" cy="276" r="5.5" fill="#34302a"/>
  <circle cx="300" cy="276" r="5.5" fill="#34302a"/>
  <g stroke="#34302a" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round">
    <path d="M214,296 L204,316"/><path d="M326,296 L336,316"/>
    <path d="M212,266 L200,258"/><path d="M328,266 L340,258"/>
    <path d="M252,318 L242,348"/><path d="M288,318 L298,348"/>
  </g>

  <!-- ── cloak ring at the shoulder ── -->
  <circle cx="174" cy="450" r="15" fill="none" stroke="#34302a" stroke-width="6"/>

  <!-- ══ THE SCALE — the reason she is on this stone at all ══ -->
  <g stroke="#34302a" fill="none" stroke-linecap="round">
    <path d="M270,436 L270,476" stroke-width="3.4"/>
    <path d="M196,478 L344,478" stroke-width="5"/>
    <path d="M202,482 L202,510" stroke-width="2.8"/>
    <path d="M338,482 L338,510" stroke-width="2.8"/>
  </g>
  <circle cx="270" cy="478" r="7" fill="#34302a"/>
  <path d="M180,510 Q202,536 224,510 Z" fill="#34302a"/>
  <path d="M316,510 Q338,536 360,510 Z" fill="#34302a"/>

  <!-- ══ THE TALLY STICK, tucked along the fall of the cloak ══ -->
  <path d="M142,676 L168,552 L188,556 L162,676 Z" fill="#c9c3b2" stroke="#34302a" stroke-width="3.2"/>
  <g stroke="#34302a" stroke-width="3" stroke-linecap="round">
    <path d="M150,646 L170,650"/><path d="M156,618 L176,622"/>
    <path d="M162,590 L182,594"/><path d="M167,566 L187,570"/>
  </g>

</g>

<rect width="540" height="720" filter="url(#grain)" opacity=".2" style="mix-blend-mode:multiply"/>
</svg>
