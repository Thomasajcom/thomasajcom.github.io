<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="An archer at full draw looses across open water at a distant sail, carved in stone">
<defs>
  <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#d8d2c1"/>
    <stop offset=".52" stop-color="#c7c1b0"/>
    <stop offset="1" stop-color="#aea795"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="4" seed="17"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="carve" x="-12%" y="-12%" width="124%" height="124%">
    <feTurbulence type="fractalNoise" baseFrequency="0.024" numOctaves="3" seed="31" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow in="d" dx="2.2" dy="2.2" stdDeviation="0" flood-color="#f4eee0" flood-opacity=".9"/>
  </filter>
</defs>

<rect width="640" height="360" fill="url(#stone)"/>

<g filter="url(#carve)">
  <!-- ── open water, the whole middle distance ── -->
  <g stroke="#34302a" stroke-width="3.2" fill="none" stroke-linecap="round" opacity=".72">
    <path d="M-14,250 q22,-8 44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0"/>
    <path d="M-36,272 q22,-8 44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0"/>
    <path d="M-14,294 q22,-8 44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0 t44,0"/>
  </g>

  <!-- ══ THE QUARRY — small, far off, under full sail ══ -->
  <g>
    <path d="M508,192 Q560,206 612,192 Q560,218 508,192 Z" fill="#34302a"/>
    <path d="M560,192 L560,126" stroke="#34302a" stroke-width="4"/>
    <path d="M530,130 L590,130" stroke="#34302a" stroke-width="3.4"/>
    <!-- the lozenge sail: the one shape that says 'longship' at any size -->
    <path d="M532,132 L588,132 L596,180 L524,180 Z" fill="none" stroke="#34302a" stroke-width="3.6"/>
    <g stroke="#a8492f" stroke-width="2.4" opacity=".9">
      <path d="M550,132 L536,180"/><path d="M568,132 L584,180"/>
      <path d="M528,155 L592,155"/>
    </g>
  </g>

  <!-- ══ THE ARCHER ══ -->
  <!-- cloak, thrown back by the wind -->
  <path d="M138,178 L82,286 L134,262 L146,206 Z" fill="#a8492f"/>
  <path d="M138,182 L100,258" stroke="#34302a" stroke-width="2.6" opacity=".55" fill="none"/>

  <!-- legs, braced -->
  <g stroke="#34302a" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M152,236 L126,306"/>
    <path d="M154,236 L178,304"/>
  </g>
  <!-- torso -->
  <path d="M132,242 L172,242 L166,168 L140,168 Z" fill="#34302a"/>
  <!-- belt -->
  <path d="M133,228 L171,228" stroke="#cdc7b6" stroke-width="3.4" opacity=".55"/>

  <!-- head, in profile, facing the shot -->
  <circle cx="154" cy="146" r="17" fill="#34302a"/>
  <!-- braid, whipping back -->
  <g stroke="#34302a" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M140,142 C122,138 108,144 100,156"/>
  </g>
  <g stroke="#cdc7b6" stroke-width="2" stroke-linecap="round" opacity=".5">
    <path d="M132,138 L128,146"/><path d="M120,138 L117,147"/><path d="M108,142 L106,151"/>
  </g>

  <!-- arms: front arm locked out, back arm at full draw -->
  <g stroke="#34302a" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M162,176 L212,168"/>
    <path d="M144,176 L126,180 L140,158"/>
  </g>

  <!-- ══ THE BOW at full draw ══ -->
  <path d="M214,104 C252,128 252,212 214,236" fill="none" stroke="#34302a" stroke-width="7" stroke-linecap="round"/>
  <path d="M214,104 L142,170 L214,236" fill="none" stroke="#34302a" stroke-width="2.4"/>
  <!-- the nocked arrow -->
  <path d="M142,170 L226,166" stroke="#34302a" stroke-width="3.2"/>
  <path d="M226,166 l-13,-6 l0,12 z" fill="#a8492f"/>

  <!-- ══ THE VOLLEY ALREADY IN THE AIR ══ -->
  <g fill="none" stroke="#a8492f" stroke-width="2.8" stroke-linecap="round">
    <path d="M262,150 Q378,78 494,156"/>
    <path d="M266,162 Q384,94 500,170"/>
    <path d="M270,174 Q390,112 504,184"/>
  </g>
  <g fill="#a8492f">
    <path d="M494,156 l-11,-9 l-2,13 z"/>
    <path d="M500,170 l-11,-9 l-2,13 z"/>
    <path d="M504,184 l-11,-9 l-2,13 z"/>
  </g>

  <!-- ══ OUR OWN DECK, underfoot ══ -->
  <path d="M-20,362 L-20,300 C90,292 200,304 280,330 L280,362 Z" fill="#34302a"/>
  <g stroke="#cdc7b6" stroke-width="2.6" fill="none" opacity=".4">
    <path d="M-20,322 C86,314 190,326 268,348"/>
  </g>
  <!-- arrows lashed upright to the sheer, ready -->
  <g stroke="#34302a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M226,308 L222,254"/><path d="M236,310 L238,254"/><path d="M246,312 L252,258"/>
  </g>
  <path d="M216,286 L256,290" stroke="#34302a" stroke-width="5"/>
</g>

<rect width="640" height="360" filter="url(#grain)" opacity=".22" style="mix-blend-mode:multiply"/>
</svg>
