<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viking Voyage — Game Design Document</title>
<meta name="description" content="The living design document for Viking Voyage, a Viking naval roguelite. Every decision, open question and rejected idea, in short modules.">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: a sea-chart header (the voyage drawn as a route), then a sticky module
   list on the left and one reading column of short statements on the right.
   This page only draws the design. The design itself lives in gdd-data.js. */
:root{
  --bg:#EEF1EF; --panel:#F8FAF9; --hover:#E3E9E7;
  --ink:#11262B; --ink2:#4B6065; --ink3:#66787C;
  --line:#CDD7D5; --line2:#DEE5E3;
  --sea:#155E69;                 /* accent, links, Decided */
  --open:#8A5A00; --open-bg:#F5EBD0;
  --risk:#A93828; --risk-bg:#F5E2DD;
  --rej:#66787C;  --played:#27734A;
  --display:"Bricolage Grotesque","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --bar:56px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B171B; --panel:#101F24; --hover:#16292F;
    --ink:#E3EBE9; --ink2:#A3B4B6; --ink3:#7E9195;
    --line:#243A40; --line2:#192B31;
    --sea:#66BEC8; --open:#E2B04E; --open-bg:#2A2414;
    --risk:#EC8572; --risk-bg:#2D1B18; --rej:#8A999C; --played:#6FC795;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B171B; --panel:#101F24; --hover:#16292F;
  --ink:#E3EBE9; --ink2:#A3B4B6; --ink3:#7E9195;
  --line:#243A40; --line2:#192B31;
  --sea:#66BEC8; --open:#E2B04E; --open-bg:#2A2414;
  --risk:#EC8572; --risk-bg:#2D1B18; --rej:#8A999C; --played:#6FC795;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body)}
[hidden]{display:none!important}
a{color:var(--sea);text-decoration-thickness:1px;text-underline-offset:3px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:3px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.mono{font:500 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
svg.mk{width:12px;height:12px;flex:none;display:block}

/* ── header ─────────────────────────────────────────────────────────── */
.top{padding-block:40px 28px}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font:800 clamp(2.6rem,7vw,4.6rem)/.95 var(--display);letter-spacing:-.02em;margin:10px 0 14px;text-wrap:balance}
.pitch{font-size:clamp(1.05rem,2vw,1.25rem);line-height:1.45;max-width:38em;margin:0;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px 28px;margin:26px 0 0;padding:0;list-style:none}
.facts li{display:flex;flex-direction:column;gap:2px}
.facts b{font-weight:500;font-size:15px}
.theme{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font:500 12px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.theme:hover{background:var(--hover)}

/* ── the route ──────────────────────────────────────────────────────── */
.route-scroll{overflow-x:auto;margin-top:34px;padding-bottom:6px}
.route{min-width:760px}
.route ol{display:flex;list-style:none;margin:0;padding:0;position:relative}
.route ol::before{content:"";position:absolute;left:4%;right:4%;top:13px;border-top:2px solid var(--ink)}
.route li{flex:1 1 0;min-width:0;position:relative}
.route li.leg{flex-grow:1.7}
.route a{display:block;text-decoration:none;color:inherit;padding:0 8px 8px;border-radius:6px;text-align:center}
.route a:hover{background:var(--hover)}
.route .mark{height:28px;display:flex;align-items:center;justify-content:center;gap:0;position:relative}
.route .port i{width:14px;height:14px;border:2px solid var(--ink);background:var(--bg);border-radius:50%}
.route .peak i{width:18px;height:18px;background:var(--risk);transform:rotate(45deg);box-shadow:0 0 0 4px var(--bg)}
.route .leg .mark{justify-content:space-evenly}
.route .leg i{width:8px;height:8px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--bg)}
.route .leg i.maybe{background:var(--bg);border:2px solid var(--ink)}
.route b{display:block;font:650 15px/1.25 var(--display);margin-top:8px}
.route small{display:block;font-size:13px;line-height:1.35;color:var(--ink2);margin-top:2px}
.route-return{margin:2px 8% 0;height:22px;border:2px dashed var(--ink3);border-top:0;border-radius:0 0 18px 18px;position:relative}
.route-return span{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);background:var(--bg);padding:0 10px;white-space:nowrap}

/* ── lock meter ─────────────────────────────────────────────────────── */
.lock{margin-top:44px;display:grid;gap:10px}
.lock-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line2)}
.lock-bar i{display:block;height:100%}
.lock-bar .d{background:var(--sea)}
.lock-bar .o{background:repeating-linear-gradient(135deg,var(--open) 0 4px,transparent 4px 7px)}
.lock-nums{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0;padding:0;list-style:none;font-size:15px}
.lock-nums li{display:flex;align-items:center;gap:7px}
.lock-nums b{font-weight:600;font-variant-numeric:tabular-nums}
.c-decided{color:var(--sea)} .c-open,.c-num{color:var(--open)} .c-risk{color:var(--risk)} .c-rejected{color:var(--rej)} .c-played{color:var(--played)}

/* ── toolbar ────────────────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-block:1px solid var(--line);margin-top:28px}
.bar-in{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding-block:10px}
.views{display:flex;gap:2px;background:var(--line2);border-radius:8px;padding:3px;overflow-x:auto;max-width:100%}
.views button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap;font-size:14px;font-weight:500;color:var(--ink2)}
.views button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.search{flex:1 1 180px;min-width:0;max-width:300px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px;font-size:14px}
.search::placeholder{color:var(--ink3)}
.reasons{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--ink2);cursor:pointer;white-space:nowrap;margin-left:auto}
.reasons input{accent-color:var(--sea);width:16px;height:16px;margin:0}

/* ── two columns ────────────────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:230px minmax(0,1fr);gap:56px;align-items:start;padding-block:28px 80px}
.side{position:sticky;top:calc(var(--bar) + 20px);max-height:calc(100vh - var(--bar) - 40px);overflow-y:auto;font-size:14px;padding-right:4px}
.side summary{display:none}
.side h3{margin:18px 0 6px;font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.side h3:first-of-type{margin-top:0}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 8px;margin-left:-8px;border-radius:5px;color:var(--ink2);text-decoration:none;line-height:1.35}
.side a:hover{background:var(--hover);color:var(--ink)}
.side a.on{color:var(--ink);font-weight:600;background:var(--line2)}
.side a.off{opacity:.38}
.side .n{font:500 11px/1 var(--mono);color:var(--open);font-variant-numeric:tabular-nums;border:1.5px solid currentColor;border-radius:999px;padding:2px 6px}
.side .n.zero{border:0;padding:0;width:7px;height:7px;background:var(--sea);border-radius:50%}

main{min-width:0;max-width:720px}
.part{font:500 12px/1.3 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:56px 0 0;display:flex;align-items:center;gap:14px}
.part::after{content:"";flex:1;border-top:1px solid var(--line)}
.part:first-child{margin-top:0}
.mod{padding-top:30px;scroll-margin-top:calc(var(--bar) + 8px)}
.mod h2{font:750 clamp(1.5rem,3.2vw,1.95rem)/1.1 var(--display);letter-spacing:-.01em;margin:0;text-wrap:balance}
.mod h2 a{color:inherit;text-decoration:none}
.mod h2 a:hover::after{content:" #";color:var(--ink3);font-weight:500}
.sum{margin:6px 0 0;color:var(--ink2);font-size:17px;line-height:1.4}
.mod-meter{display:flex;align-items:center;gap:12px;margin:14px 0 6px}
.mod-meter .lock-bar{flex:1;height:4px;border-radius:2px}
.mod-meter span{font:500 11px/1.3 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}

.grp{margin-top:10px}
.grp>h3{font:500 11px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.grp[data-g="open"],.grp[data-g="num"],.grp[data-g="risk"]{border-radius:10px;padding:14px 16px 8px;margin-top:14px}
.grp[data-g="open"],.grp[data-g="num"]{background:var(--open-bg)}
.grp[data-g="risk"]{background:var(--risk-bg)}
.grp[data-g="open"]>h3,.grp[data-g="num"]>h3{color:var(--open)}
.grp[data-g="risk"]>h3{color:var(--risk)}

.it{border-bottom:1px solid var(--line2)}
.grp .it:last-child{border-bottom:0}
.grp[data-g="open"] .it,.grp[data-g="num"] .it,.grp[data-g="risk"] .it{border-color:color-mix(in srgb,currentColor 12%,transparent)}
.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:9px 6px 9px 0;margin:0}
.row .mk{margin-top:6px}
button.row{cursor:pointer;border-radius:6px}
button.row:hover{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.chev{width:10px;height:10px;margin-top:7px;border-right:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s}
.it.open .chev,.reasons-on .chev{transform:rotate(225deg) translate(-2px,-2px)}
.tx{min-width:0;overflow-wrap:anywhere}
.s-rejected .tx{color:var(--ink2)}
.tag{display:inline-block;font:500 10.5px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:4px;padding:3px 5px;margin-left:6px;color:var(--ink3);vertical-align:2px}
.sub{margin:-2px 0 10px 24px;padding:0 0 0 16px;font-size:15px;line-height:1.45;color:var(--ink)}
.sub li{padding:2px 0}
.sub li::marker{color:var(--ink3)}
.extra{display:none;margin:-2px 0 12px 24px;font-size:14.5px;line-height:1.5;color:var(--ink2);max-width:56ch}
.it.open .extra,.reasons-on .extra{display:block}
.extra p{margin:0 0 4px}
.extra .lbl{font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-right:8px}
.extra .see a{white-space:nowrap}

.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0 18px}
.pf{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 16px 12px;min-width:0}
.pf h3{font:750 1.2rem/1.15 var(--display);margin:4px 0 12px;text-wrap:balance}
.pf dl{margin:0;display:grid;gap:10px}
.pf dt{font:500 10.5px/1.3 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.pf dd{margin:2px 0 0;font-size:14.5px;line-height:1.45;overflow-wrap:anywhere}
.pf .peak dd{color:var(--sea);font-weight:600}
.more{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.more button{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:13.5px;font-weight:500;cursor:pointer}
.more button:hover{background:var(--hover)}
.more button[aria-expanded="true"]{background:var(--panel);border-color:currentColor}
.empty{padding:60px 0;color:var(--ink2);font-size:17px}

.legend{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 6px;padding:0;list-style:none;font-size:13.5px;color:var(--ink2)}
.legend li{display:flex;align-items:center;gap:7px}
.legend b{font-weight:600;color:var(--ink)}
footer{border-top:1px solid var(--line);padding-block:24px 48px;color:var(--ink3);font-size:13.5px}

@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr);gap:20px;padding-top:18px}
  .side{position:static;max-height:none;border:1px solid var(--line);border-radius:10px;padding:0 14px}
  .side summary{display:block;cursor:pointer;padding:12px 0;font-weight:600;font-size:15px}
  .side[open]{padding-bottom:12px}
  .reasons{margin-left:0}
  .search{max-width:none}
  .bar{position:static}
  .mod{scroll-margin-top:8px}
  .top{padding-block:28px 20px}
  /* the route turns to read top to bottom */
  .route-scroll{overflow:visible}
  .route{min-width:0}
  .route ol{flex-direction:column}
  .route ol::before{left:13px;right:auto;top:16px;bottom:16px;border-top:0;border-left:2px solid var(--ink)}
  .route li.leg{flex-grow:1}
  .route a{display:grid;grid-template-columns:28px minmax(0,1fr);column-gap:14px;align-items:center;text-align:left;padding:6px 8px 6px 0}
  .route .mark{grid-row:1 / span 2;height:auto;min-height:28px;flex-direction:column;gap:5px;justify-content:center}
  .route .leg .mark{padding-block:6px}
  .route .leg i{width:6px;height:6px}
  .route b{margin-top:0;align-self:end}
  .route small{margin-top:0;align-self:start}
  .route-return{display:none}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.chev{transition:none}}
@media print{.bar,.side,.theme,.more{display:none}.cols{display:block}.grp{display:block!important}.extra{display:block}.mod{break-inside:avoid-page}}
</style>
</head>
<body>

<header class="top wrap">
  <div class="top-row">
    <div class="mono" id="kicker"></div>
    <button class="theme" id="theme" type="button" aria-label="Switch between light and dark">Dark</button>
  </div>
  <h1 id="title"></h1>
  <p class="pitch" id="pitch"></p>
  <ul class="facts" id="facts"></ul>

  <div class="route-scroll">
    <nav class="route" aria-label="One voyage, start to finish">
      <ol id="route"></ol>
      <div class="route-return" aria-hidden="true"><span class="mono">set out again with the same ship</span></div>
    </nav>
  </div>

  <section class="lock" aria-label="How much of the design is decided">
    <div class="lock-bar" id="lockbar"></div>
    <ul class="lock-nums" id="locknums"></ul>
  </section>
</header>

<div class="bar">
  <div class="bar-in wrap">
    <div class="views" id="views" role="group" aria-label="What to show">
      <button type="button" data-view="decisions" aria-pressed="true">Decisions</button>
      <button type="button" data-view="open" aria-pressed="false">Open questions</button>
      <button type="button" data-view="risks" aria-pressed="false">Risks</button>
      <button type="button" data-view="all" aria-pressed="false">Everything</button>
    </div>
    <input class="search" id="q" type="search" placeholder="Search the design" aria-label="Search the design" autocomplete="off">
    <label class="reasons"><input type="checkbox" id="reasons"> Show reasons</label>
  </div>
</div>

<div class="cols wrap">
  <details class="side" id="side" open>
    <summary>Jump to a module</summary>
    <nav id="sidenav" aria-label="Modules"></nav>
  </details>
  <main id="main">
    <noscript><p>This document needs JavaScript to draw itself. The design is in <a href="gdd-data.js">gdd-data.js</a>.</p></noscript>
  </main>
</div>

<footer class="wrap">
  <ul class="legend" id="legend"></ul>
  <p id="foot"></p>
</footer>

<script src="gdd-data.js"></script>
<script>
(function () {
  "use strict";
  var G = window.GDD;
  if (!G) { document.getElementById("main").textContent = "gdd-data.js did not load."; return; }

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  var plural = function (n, one, many) { return n + " " + (n === 1 ? one : many); };

  var MK = {
    decided: '<circle cx="6" cy="6" r="4.5" fill="currentColor"/>',
    played: '<path d="M6 .8 11.2 6 6 11.2.8 6Z" fill="currentColor"/>',
    open: '<circle cx="6" cy="6" r="3.7" fill="none" stroke="currentColor" stroke-width="2"/>',
    risk: '<path d="M6 1.2 11.3 10.6H.7Z" fill="currentColor"/>',
    rejected: '<path d="M2.5 2.5l7 7M9.5 2.5l-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    num: '<path d="M4.4 1.5v9M7.6 1.5v9M1.5 4.4h9M1.5 7.6h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>'
  };
  var mk = function (k) { return '<svg class="mk c-' + k + '" viewBox="0 0 12 12" aria-hidden="true">' + MK[k] + "</svg>"; };

  var GROUPS = [
    { g: "decided", match: function (s) { return s === "decided" || s === "played"; } },
    { g: "rejected", match: function (s) { return s === "rejected"; } },
    { g: "open", match: function (s) { return s === "open"; }, head: "Open questions", one: "open question", many: "open questions" },
    { g: "num", head: "Numbers still to set", one: "number to set", many: "numbers to set" },
    { g: "risk", match: function (s) { return s === "risk"; }, head: "Watch for", one: "risk", many: "risks" }
  ];
  var title = {}; G.modules.forEach(function (m) { title[m.id] = m.title; });
  var state = { view: "decisions", q: "", opened: {} };

  /* ── header ── */
  var d = new Date(G.meta.revised + "T12:00:00");
  var when = isNaN(d) ? G.meta.revised : d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
  $("#kicker").textContent = G.meta.kind + " · revised " + when;
  $("#title").textContent = G.meta.title;
  $("#pitch").textContent = G.meta.pitch;
  $("#facts").innerHTML = G.meta.facts.map(function (f) { return '<li><span class="mono">' + esc(f[0]) + "</span><b>" + esc(f[1]) + "</b></li>"; }).join("");

  $("#route").innerHTML = G.route.map(function (r) {
    var marks = "<i></i>";
    if (r.kind === "leg") { marks = ""; for (var i = 0; i < r.dots; i++) marks += '<i' + (r.dots === 5 && i === 4 ? ' class="maybe"' : "") + "></i>"; }
    return '<li class="' + r.kind + '"><a href="#' + r.to + '"><span class="mark">' + marks + "</span><b>" + esc(r.label) + "</b><small>" + esc(r.sub) + "</small></a></li>";
  }).join("");

  /* ── counts ── */
  var total = { decided: 0, played: 0, open: 0, risk: 0, rejected: 0, num: 0 };
  G.modules.forEach(function (m) {
    m.c = { decided: 0, played: 0, open: 0, risk: 0, rejected: 0, num: (m.numbers || []).length };
    m.items.forEach(function (it) { m.c[it.s]++; });
    Object.keys(total).forEach(function (k) { total[k] += m.c[k]; });
  });
  var settled = total.decided + total.played, asked = settled + total.open;
  $("#lockbar").innerHTML = '<i class="d" style="width:' + (100 * settled / asked) + '%"></i><i class="o" style="width:' + (100 * total.open / asked) + '%"></i>';
  $("#locknums").innerHTML =
    "<li>" + mk("decided") + "<span><b>" + total.decided + "</b> decided</span></li>" +
    "<li>" + mk("open") + "<span><b>" + total.open + "</b> open questions</span></li>" +
    "<li>" + mk("num") + "<span><b>" + total.num + "</b> numbers to set</span></li>" +
    "<li>" + mk("risk") + "<span><b>" + total.risk + "</b> risks noted</span></li>" +
    "<li>" + mk("played") + "<span><b>" + total.played + "</b> played</span></li>";

  /* ── items ── */
  function itemHTML(it, kind) {
    var extra = "";
    if (it.why) extra += '<p><span class="lbl">Why</span>' + esc(it.why) + "</p>";
    if (it.rec) extra += '<p><span class="lbl">Suggested</span>' + esc(it.rec) + "</p>";
    if (it.see && it.see.length) extra += '<p class="see"><span class="lbl">See</span>' + it.see.map(function (id) { return '<a href="#' + id + '">' + esc(title[id] || id) + "</a>"; }).join(" · ") + "</p>";
    var inner = mk(kind) + '<span class="tx">' + esc(it.t) + (it.tag ? '<span class="tag">' + esc(it.tag) + "</span>" : "") + "</span>";
    var row = extra
      ? '<button type="button" class="row" aria-expanded="false">' + inner + '<span class="chev" aria-hidden="true"></span></button>'
      : '<div class="row">' + inner + "<span></span></div>";
    var list = it.list ? '<ul class="sub">' + it.list.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "";
    var hay = [it.t, it.why, it.rec, (it.list || []).join(" ")].join(" ").toLowerCase();
    return '<div class="it s-' + kind + '" data-text="' + esc(hay) + '">' + row + list + (extra ? '<div class="extra">' + extra + "</div>" : "") + "</div>";
  }

  /* ── modules ── */
  var html = "", nav = "";
  G.parts.forEach(function (p) {
    var mods = G.modules.filter(function (m) { return m.part === p.id; });
    if (!mods.length) return;
    html += '<div class="part" data-part="' + p.id + '">' + esc(p.title) + "</div>";
    nav += "<h3>" + esc(p.title) + "</h3>";
    mods.forEach(function (m) {
      var known = m.c.decided + m.c.played, q = known + m.c.open;
      var stats = [];
      if (known) stats.push(known + " decided");
      if (m.c.rejected) stats.push(m.c.rejected + " cut");
      if (m.c.open) stats.push(m.c.open + " open");
      html += '<section class="mod" id="' + m.id + '" data-part="' + p.id + '">' +
        '<h2><a href="#' + m.id + '">' + esc(m.title) + "</a></h2>" +
        '<p class="sum">' + esc(m.sum) + "</p>" +
        '<div class="mod-meter"><div class="lock-bar">' + (q ? '<i class="d" style="width:' + (100 * known / q) + '%"></i><i class="o" style="width:' + (100 * m.c.open / q) + '%"></i>' : "") + "</div><span>" + stats.join(" · ") + "</span></div>";
      if (m.profiles) {
        html += '<div class="profiles">' + m.profiles.map(function (pf) {
          var hay = [pf.name, pf.role].concat(pf.fields.map(function (f) { return f[1]; })).join(" ").toLowerCase();
          return '<article class="pf" data-text="' + esc(hay) + '"><div class="mono">' + esc(pf.role) + "</div><h3>" + esc(pf.name) + "</h3><dl>" +
            pf.fields.map(function (f, i) { return "<div" + (i === 0 ? ' class="peak"' : "") + "><dt>" + esc(f[0]) + "</dt><dd>" + esc(f[1]) + "</dd></div>"; }).join("") + "</dl></article>";
        }).join("") + "</div>";
      }
      /* decisions first, then the buttons, then whatever the buttons reveal */
      var more = "", first = "", rest = "";
      GROUPS.forEach(function (grp) {
        var body = grp.g === "num"
          ? (m.numbers || []).map(function (n) { return itemHTML({ t: n }, "num"); }).join("")
          : m.items.filter(function (it) { return grp.match(it.s); }).map(function (it) { return itemHTML(it, it.s); }).join("");
        if (!body) return;
        if (grp.head) {
          var n = grp.g === "num" ? m.c.num : m.c[grp.g];
          more += '<button type="button" data-g="' + grp.g + '" aria-expanded="false" class="c-' + grp.g + '">' + mk(grp.g) + plural(n, grp.one, grp.many) + "</button>";
        }
        var block = '<div class="grp" data-g="' + grp.g + '">' + (grp.head ? "<h3>" + mk(grp.g) + grp.head + "</h3>" : "") + body + "</div>";
        if (grp.head) rest += block; else first += block;
      });
      html += first + (more ? '<div class="more">' + more + "</div>" : "") + rest + "</section>";
      nav += '<a href="#' + m.id + '" data-id="' + m.id + '"><span>' + esc(m.title) + "</span>" +
        (m.c.open ? '<span class="n" title="' + plural(m.c.open, "open question", "open questions") + '">' + m.c.open + "</span>" : '<span class="n zero" title="Nothing open"></span>') + "</a>";
    });
  });
  $("#main").innerHTML = html + '<p class="empty" id="empty" hidden></p>';
  $("#sidenav").innerHTML = nav;

  $("#legend").innerHTML =
    "<li>" + mk("decided") + "<span><b>Decided</b> chosen, not yet played</span></li>" +
    "<li>" + mk("played") + "<span><b>Played</b> proven in a running game</span></li>" +
    "<li>" + mk("open") + "<span><b>Open</b> undecided</span></li>" +
    "<li>" + mk("risk") + "<span><b>Risk</b> something to watch</span></li>" +
    "<li>" + mk("rejected") + "<span><b>Cut</b> rejected on purpose</span></li>";
  $("#foot").textContent = "Nothing here has been played yet. When the game and this document disagree, the game is right and the document is stale.";

  /* ── what is visible ── */
  function apply() {
    var q = state.q.trim().toLowerCase(), v = state.view, shown = 0;
    $$(".mod").forEach(function (mod) {
      var any = false;
      $$(".grp", mod).forEach(function (g) {
        var k = g.dataset.g, on;
        if (q || v === "all") on = true;
        else if (v === "decisions") on = k === "decided" || k === "rejected" || !!state.opened[mod.id + ":" + k];
        else if (v === "open") on = k === "open" || k === "num";
        else on = k === "risk";
        var n = 0;
        $$(".it", g).forEach(function (it) { var hit = !q || it.dataset.text.indexOf(q) !== -1; it.hidden = !hit; if (hit) n++; });
        g.hidden = !(on && n);
        if (!g.hidden) any = true;
      });
      var profs = $(".profiles", mod);
      if (profs) {
        var np = 0;
        $$(".pf", profs).forEach(function (pf) { var hit = !q || pf.dataset.text.indexOf(q) !== -1; pf.hidden = !hit; if (hit) np++; });
        profs.hidden = !((q || v === "decisions" || v === "all") && np);
        if (!profs.hidden) any = true;
      }
      var more = $(".more", mod);
      if (more) {
        more.hidden = !!q || v !== "decisions";
        $$("button", more).forEach(function (b) { b.setAttribute("aria-expanded", String(!!state.opened[mod.id + ":" + b.dataset.g])); });
      }
      mod.hidden = !any;
      if (any) shown++;
      var link = $('#sidenav a[data-id="' + mod.id + '"]');
      if (link) link.classList.toggle("off", !any);
    });
    $$(".part").forEach(function (p) { p.hidden = !$$('.mod[data-part="' + p.dataset.part + '"]').some(function (m) { return !m.hidden; }); });
    var empty = $("#empty");
    empty.hidden = shown > 0;
    if (!shown) empty.textContent = q ? "Nothing in the design mentions “" + state.q.trim() + "”." : "Nothing to show in this view.";
  }

  $("#views").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    state.view = b.dataset.view;
    $$("#views button").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    try { localStorage.setItem("vv-gdd-view", state.view); } catch (err) {}
    apply();
  });
  $("#q").addEventListener("input", function (e) { state.q = e.target.value; apply(); });
  $("#reasons").addEventListener("change", function (e) { document.body.classList.toggle("reasons-on", e.target.checked); });
  $("#main").addEventListener("click", function (e) {
    var row = e.target.closest("button.row");
    if (row) { var it = row.parentNode, open = it.classList.toggle("open"); row.setAttribute("aria-expanded", String(open)); return; }
    var more = e.target.closest(".more button");
    if (more) { var key = more.closest(".mod").id + ":" + more.dataset.g; state.opened[key] = !state.opened[key]; apply(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); $("#q").focus(); }
  });

  /* ── theme ── */
  var root = document.documentElement, themeBtn = $("#theme");
  var isDark = function () { var t = root.getAttribute("data-theme"); return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; };
  var paint = function () { themeBtn.textContent = isDark() ? "Light" : "Dark"; };
  try { var saved = localStorage.getItem("vv-gdd-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (err) {}
  paint();
  themeBtn.addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("vv-gdd-theme", next); } catch (err) {}
    paint();
  });

  /* ── module list: collapsed on phones, highlights where you are ── */
  var side = $("#side"), narrow = matchMedia("(max-width: 860px)");
  var fit = function () { side.open = !narrow.matches; };
  fit(); narrow.addEventListener("change", fit);
  $("#sidenav").addEventListener("click", function (e) { if (e.target.closest("a") && narrow.matches) side.open = false; });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        $$("#sidenav a").forEach(function (a) { a.classList.toggle("on", a.dataset.id === en.target.id); });
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    $$(".mod").forEach(function (m) { io.observe(m); });
  }

  try {
    var v = localStorage.getItem("vv-gdd-view");
    if (v && $('#views button[data-view="' + v + '"]')) { state.view = v; $$("#views button").forEach(function (x) { x.setAttribute("aria-pressed", String(x.dataset.view === v)); }); }
  } catch (err) {}
  apply();
  if (location.hash.length > 1) { var target = document.getElementById(location.hash.slice(1)); if (target) target.scrollIntoView(); }
})();
</script>
</body>
</html>
